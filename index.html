<!doctype html><html lang="bg"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Детективи на истината</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1728;color:#eaf2ff;font:18px system-ui}main{max-width:1050px;margin:auto;padding:32px}header{color:#75e3d2;letter-spacing:3px;font-size:13px}h1{font-size:clamp(32px,6vw,60px);margin:20px 0}h2{color:#75e3d2}section,article{background:#152940;border:1px solid #34516a;border-radius:16px;padding:24px;margin:18px 0} .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.grid article{margin:0}button,a.btn{display:inline-block;background:#75e3d2;color:#102437;border:0;border-radius:9px;padding:12px 18px;font:inherit;font-weight:bold;cursor:pointer;text-decoration:none;margin:5px 0}button.secondary{background:#29465e;color:white}textarea,input,select{width:100%;background:#0b1728;color:white;border:1px solid #58758d;border-radius:8px;padding:12px;font:inherit;margin:8px 0 18px}small{color:#b3c7da}blockquote{border-left:4px solid #f2bd70;padding:12px 20px;background:#20354c;margin:15px 0}progress{width:100%;accent-color:#75e3d2}a{color:#75e3d2}button:focus-visible,a:focus-visible{outline:3px solid orange} @media print{body{background:white;color:black}section,article{background:white;color:black}button{display:none}}</style><main><header>КМИТ × БЕЛ • 6. КЛАС • ЦЕНТЪР ЗА РАЗСЛЕДВАНЕ</header><div id="app"></div></main><script>
const cases=[["Следите на времето","Извънредна новина! От понеделник, 14 декември 2026 г., учениците излизат в грипна ваканция! Споделете в училищните групи!","Благоевград грипна ваканция 22 24 януари 2018 община",["Кога е публикувана новината и за кои дни се отнася?","За коя община важи съобщението?","Как ще проверите дали на 14 декември 2026 г. действително няма занятия?"],"2018; януари","недостатъчно данни","Стара заповед за друга дата не доказва, че на 14 декември 2026 г. няма училище."],["Факт или мнение","Minecraft е най-добрата игра в света и е напълно безплатна!","Minecraft official free trial FAQ",["Коя част е лично мнение?","Какво означава free trial (безплатна пробна версия)?","Колко време продължава пробната версия според официалния сайт? Напишете точно заглавие."],"free trial; how long; buying","опровергано","Безплатната пробна версия не означава безплатна пълна игра."],["Подвеждащото заглавие","ШОК! Самолетният режим зарежда всеки телефон два пъти по-бързо!","airplane mode charge faster test Engadget",["Кои думи привличат вниманието и кои обещават конкретен резултат?","Колко минути са спестени според посочените тестове?","Доказват ли тестовете двойно по-бързо зареждане на всеки телефон? Пренапишете заглавието."],"minutes; tests","опровергано","Малка икономия на време не означава двойна скорост при всеки телефон."],["Двойна проверка","От Космоса Слънцето изглежда бяло, а не жълто!","NASA Stanford what color is the sun white",["Какъв цвят посочва NASA?","Какво обяснява Станфордският университет за бялата светлина?","Защо Слънцето може да изглежда оранжево от Земята? Сравнете източниците. Не гледайте директно към Слънцето."],"white; color; atmosphere","потвърдено","Бялата светлина съдържа всички видими цветове; атмосферата влияе на възприемания цвят."]];
const links=[[["Община Благоевград – архив","https://blagoevgrad.bg/news/kmetut-na-blagoevgrad-obiavi-gripna-vakanciia-za-uchenicite-na-teritoriiata-na-obshtinata"]],[["Minecraft – официална информация","https://www.minecraft.net/en-us/free-trial"]],[["Engadget – резултати от тестове","https://www.engadget.com/2219824/airplane-mode-phone-charge-speed-explained/"]],[["NASA – учебна справка","https://spaceplace.nasa.gov/coloring-pages/en/Sun.pdf"],["Stanford – обяснение","https://solar-center.stanford.edu/FAQ/Qsuncolor.html"]]];
const app=document.getElementById('app');let team=0,step=0,data={};const search=q=>'https://www.google.com/search?q='+encodeURIComponent(q);function home(){app.innerHTML='<h1>Детективи на истината</h1><p>Четири екипа. Четири случая. Една мисия: проверете, преди да споделите.</p><section><h2>Първа реакция</h2><blockquote>'+cases[2][1]+'</blockquote><p>Вярвате ли? Не вярвате ли? Или първо ще проверите? Обсъдете с учителите.</p></section><div class="grid">'+cases.map((c,i)=>`<article><small>ДОСИЕ 0${i+1}</small><h2>${c[0]}</h2><button onclick="start(${i})">Отвори досието →</button></article>`).join('')+'</div>'}function start(i){team=i;step=0;data={};render()}function save(){document.querySelectorAll('[data-field]').forEach(e=>data[e.dataset.field]=e.value)}function go(n){save();step=n;render()}function render(){let c=cases[team];app.innerHTML=`<button class="secondary" onclick="if(confirm('Към началото? Текущите отговори ще се загубят.'))home()">← Начало</button><h1>${c[0]}</h1><small>ДОСИЕ 0${team+1} • ЕТАП ${step+1} ОТ 4</small><progress max="4" value="${step+1}"></progress><section><small>СИМУЛИРАНА ПУБЛИКАЦИЯ • Измислен автор: Ученически новини • Реалните източници са в етап 2</small><blockquote>${c[1]}</blockquote><small>Примерни реакции: 128 харесвания · 32 споделяния (измислени). Популярността не е доказателство.</small><div id="stage"></div></section>`;let s=document.getElementById('stage');if(step===0)s.innerHTML='<h2>01 / Разпределете ролите</h2><p>Анализатор • Търсещ • Проверяващ • Секретар • Говорител</p><p>Всеки споделя поне едно наблюдение. Какво точно трябва да проверите?</p>'+field('claim','Проверявано твърдение')+'<button onclick="go(1)">Към доказателствата →</button>';if(step===1)s.innerHTML=`<h2>02 / Намерете доказателства</h2><p>Отворете посочения източник или го намерете чрез търсачка. Използвайте Ctrl+F: ${c[4]}.</p><a class="btn" target="_blank" rel="noopener" href="${search(c[2])}">Търси източник ↗</a> ${links[team].map(([name,url])=>`<a class="btn" target="_blank" rel="noopener" href="${url}">${name} ↗</a>`).join(" ")}<p>При нужда използвайте превода на браузъра. Четете информацията, без да изтегляте игри или да влизате в профили.</p>`+c[3].map((q,i)=>field('q'+i,q)).join('')+field('url','Адреси на използваните страници')+'<button class="secondary" onclick="go(0)">Назад</button> <button onclick="go(2)">Към заключението →</button>';if(step===2)s.innerHTML='<h2>03 / Вашето решение</h2><label>Какво установихте?<select data-field="verdict"><option value="">Изберете</option><option>потвърдено</option><option>опровергано</option><option>недостатъчно данни</option></select></label>'+field('e1','Доказателство 1')+field('e2','Доказателство 2')+field('summary','Общо заключение за представяне')+'<button class="secondary" onclick="go(1)">Назад</button> <button onclick="finish()">Провери решението</button><p id="feedback" role="status"></p>';if(step===3)s.innerHTML='<h2>04 / Досието е завършено</h2><p>Представете решението си за две минути. Посочете двете доказателства и източниците.</p>'+field('exit','Преди да споделя информация, ще…')+'<button onclick="downloadReport()">Запази отчет</button> <button class="secondary" onclick="go(2)">Прегледай заключението</button>';document.querySelectorAll('[data-field]').forEach(e=>e.value=data[e.dataset.field]||'')}
function field(k,label){return `<label>${label}<textarea rows="2" data-field="${k}"></textarea></label>`}function finish(){save();let f=document.getElementById('feedback');if(!data.verdict||!data.e1?.trim()||!data.e2?.trim()||!data.summary?.trim()){f.textContent='Попълнете решението, двете доказателства и заключението.';return}if(data.verdict!==cases[team][5]&&!(team===2&&data.verdict==='недостатъчно данни')){f.textContent='Проверете отново. '+cases[team][6];return}go(3)}function downloadReport(){save();let c=cases[team];let content=['Досие: '+c[0],c[1],'Проверяваме: '+(data.claim||''),...c[3].map((q,i)=>q+' '+(data['q'+i]||'')),'Източници: '+(data.url||''),'Решение: '+data.verdict,'Доказателство 1: '+data.e1,'Доказателство 2: '+data.e2,'Заключение: '+data.summary,'Преди да споделя: '+(data.exit||'')].join('\n\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type:'text/plain;charset=utf-8'}));a.download='dosie-'+(team+1)+'.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}home();</script></html>
