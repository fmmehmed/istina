<!doctype html><html lang="bg"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Детективи на истината</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1728;color:#eaf2ff;font:18px system-ui}main{max-width:1050px;margin:auto;padding:32px}header{color:#75e3d2;letter-spacing:3px;font-size:13px}h1{font-size:clamp(32px,6vw,60px);margin:20px 0}h2{color:#75e3d2}section,article{background:#152940;border:1px solid #34516a;border-radius:16px;padding:24px;margin:18px 0} .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.grid article{margin:0}button,a.btn{display:inline-block;background:#75e3d2;color:#102437;border:0;border-radius:9px;padding:12px 18px;font:inherit;font-weight:bold;cursor:pointer;text-decoration:none;margin:5px 0}button.secondary{background:#29465e;color:white}textarea,input,select{width:100%;background:#0b1728;color:white;border:1px solid #58758d;border-radius:8px;padding:12px;font:inherit;margin:8px 0 18px}small{color:#b3c7da}blockquote{border-left:4px solid #f2bd70;padding:12px 20px;background:#20354c;margin:15px 0}progress{width:100%;accent-color:#75e3d2}a{color:#75e3d2}button:focus-visible,a:focus-visible{outline:3px solid orange} @media print{body{background:white;color:black}section,article{background:white;color:black}button{display:none}}.social{background:#f5f8fc;color:#152940}.social small{color:#435b70}.social h1{font-size:clamp(28px,4vw,48px)}.phoneart{background:#173b65;color:white;border-radius:14px;text-align:center;padding:18px;font-size:clamp(36px,7vw,80px)}.votes button{background:#29465e;color:white}.votes button.chosen{outline:4px solid #f2bd70}.reveal{text-align:center;padding:48px 20px;animation:appear .6s ease-out}@keyframes appear{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){.reveal{animation:none}}</style><main><header>КМИТ × БЕЛ • 6. КЛАС • ЦЕНТЪР ЗА РАЗСЛЕДВАНЕ</header><div const app=document.getElementById('app');let team=0,step=0,data={};const search=q=>'https://www.google.com/search?q='+encodeURIComponent(q);function home(){app.innerHTML='<h1>Детективи на истината</h1><p>Четири екипа. Четири случая. Една мисия.</p><button onclick="intro()">Начало на мисията →</button> <button class="secondary" onclick="dossiers()">Към досиетата</button>'}
function intro(){app.innerHTML=`<section class="social"><h3>⚡ Tech News BG</h3><small>Преди 2 часа</small><h1>😱 ШОК! Самолетният режим зарежда всеки телефон ДВА ПЪТИ по-бързо!</h1><p>Открит е невероятен трик! Сподели с приятелите си!</p><div class="phoneart" aria-hidden="true">✈　🔋　⚡</div><p>👍 2,4 хил. харесвания · 186 коментара · 857 споделяния</p></section><section><h2>А вие бихте ли повярвали?</h2><div class="grid votes"><button onclick="vote(this)">ВЯРВАМ</button><button onclick="vote(this)">НЕ ВЯРВАМ</button><button onclick="vote(this)">ПЪРВО ЩЕ ПРОВЕРЯ</button></div><p id="voteNote" role="status">Гласувайте с вдигане на ръка. Няма автоматично оценяване.</p><button onclick="reveal()">Разкрий темата на урока →</button> <button class="secondary" onclick="home()">Назад</button></section>`}
function vote(b){document.querySelectorAll('.votes button').forEach(x=>{x.classList.toggle('chosen',x===b);x.setAttribute('aria-pressed',String(x===b))});document.getElementById('voteNote').textContent='Избрана позиция: '+b.textContent+'. Как бихте я аргументирали?'}
function reveal(){app.innerHTML='<section class="reveal"><small>КМИТ × БЕЛ</small><h1>Как да разпознаем истината в интернет?</h1><h2>Детективи на истината</h2><p>СПРИ • ПРОВЕРИ • РЕШИ</p><small>Публикациите и реакциите в мисията са създадени за учебни цели.</small><button onclick="dossiers()">Към четирите досиета →</button> <button class="secondary" onclick="intro()">Назад към публикацията</button></section>'}
function dossiers(){app.innerHTML='<h1>Детективски досиета</h1><p>Изберете досието на своя екип.</p><div class="grid">'+cases.map((c,i)=>`<article><small>ДОСИЕ 0${i+1}</small><h2>${c[0]}</h2><button onclick="start(${i})">Отвори досието →</button></article>`).join('')+'</div><button class="secondary" onclick="home()">← Начало</button>'}
function start(i){team=i;step=0;data={};render()}function save(){document.querySelectorAll('[data-field]').forEach(e=>data[e.dataset.field]=e.value)}function go(n){save();step=n;render()}function render(){let c=cases[team];app.innerHTML=`<button class="secondary" onclick="if(confirm('Към началото? Текущите отговори ще се загубят.'))home()">← Начало</button><h1>${c[0]}</h1><small>ДОСИЕ 0${team+1} • ЕТАП ${step+1} ОТ 4</small><progress max="4" value="${step+1}"></progress><section><small>Ученически новини</small><blockquote>${c[1]}</blockquote><small>128 харесвания · 32 споделяния</small><div id="stage"></div></section>`;let s=document.getElementById('stage');if(step===0)s.innerHTML='<h2>01 / Разпределете ролите</h2><p>Анализатор • Търсещ • Проверяващ • Секретар • Говорител</p><p>Всеки споделя поне едно наблюдение върху публикацията.</p><button onclick="go(1)">Към доказателствата →</button>';if(step===1)s.innerHTML=`<h2>02 / Намерете доказателства</h2><p>Отворете посочения източник или го намерете чрез търсачка. Използвайте Ctrl+F: ${c[4]}.</p><a class="btn" target="_blank" rel="noopener" href="${search(c[2])}">Търси източник ↗</a> ${links[team].map(([name,url])=>`<a class="btn" target="_blank" rel="noopener" href="${url}">${name} ↗</a>`).join(" ")}<p>При нужда използвайте превода на браузъра. Четете информацията, без да изтегляте игри или да влизате в профили.</p>`+c[3].map((q,i)=>field('q'+i,q)).join('')+field('url','Адреси на използваните страници')+'<button class="secondary" onclick="go(0)">Назад</button> <button onclick="go(2)">Към заключението →</button>';if(step===2)s.innerHTML='<h2>03 / Вашето решение</h2><label>Какво установихте?<select data-field="verdict"><option value="">Изберете</option><option>потвърдено</option><option>опровергано</option><option>недостатъчно данни</option></select></label>'+field('e1','Доказателство 1')+field('e2','Доказателство 2')+field('summary','Общо заключение за представяне')+'<button class="secondary" onclick="go(1)">Назад</button> <button onclick="finish()">Провери решението</button><p id="feedback" role="status"></p>';if(step===3)s.innerHTML='<h2>04 / Досието е завършено</h2><p>Публикацията и реакциите са учебна симулация. Представете решението си за две минути. Посочете двете доказателства и източниците.</p>'+field('exit','Преди да споделя информация, ще…')+'<button onclick="downloadReport()">Запази отчет</button> <button class="secondary" onclick="go(2)">Прегледай заключението</button>';document.querySelectorAll('[data-field]').forEach(e=>e.value=data[e.dataset.field]||'');if(step===3){const report=speakerReport(s,'Екип '+(team+1)+' • '+c[0],c[1],data);s.insertBefore(report,s.querySelector('label'))}}
function speakerReport(parent,name,claim,answers){const box=document.createElement('article');box.style.overflowWrap='anywhere';const h=document.createElement('h2');h.textContent='Доклад на говорителя';box.append(h);const sub=document.createElement('h3');sub.textContent=name;box.append(sub);for(const [label,value] of [['Какво проверихме?',claim],['Какво установихме?',answers.verdict],['Доказателство 1',answers.e1],['Доказателство 2',answers.e2],['Нашите източници',answers.url],['Нашето заключение',answers.summary]]){const p=document.createElement('p'),strong=document.createElement('strong');strong.textContent=label;p.append(strong,document.createElement('br'),document.createTextNode(value||'Не е попълнено'));p.style.whiteSpace='pre-wrap';box.append(p)}const note=document.createElement('small');note.textContent='Време за представяне: 2 минути';box.append(note);parent.append(box);return box}
function field(k,label){return `<label>${label}<textarea rows="2" data-field="${k}"></textarea></label>`}function finish(){save();let f=document.getElementById('feedback');if(!data.verdict||!data.e1?.trim()||!data.e2?.trim()||!data.summary?.trim()){f.textContent='Попълнете решението, двете доказателства и заключението.';return}if(data.verdict!==cases[team][5]&&!(team===2&&data.verdict==='недостатъчно данни')){f.textContent='Проверете отново. '+cases[team][6];return}go(3)}function downloadReport(){save();let c=cases[team];let content=['Досие: '+c[0],c[1],...c[3].map((q,i)=>q+' '+(data['q'+i]||'')),'Източници: '+(data.url||''),'Решение: '+data.verdict,'Доказателство 1: '+data.e1,'Доказателство 2: '+data.e2,'Заключение: '+data.summary,'Преди да споделя: '+(data.exit||'')].join('\n\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type:'text/plain;charset=utf-8'}));a.download='dosie-'+(team+1)+'.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}home();</script><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';

const fb=initializeApp({"apiKey":"AIzaSyC5x7nFKGi-128GwH-f2JprSzM_PgfuPXU","authDomain":"detektivi-istina.firebaseapp.com","databaseURL":"https://detektivi-istina-default-rtdb.europe-west1.firebasedatabase.app","projectId":"detektivi-istina","appId":"1:168991516996:web:5572acfd6dcd6325164f11"},'student'), auth=getAuth(fb), db=getDatabase(fb);
let ready=new Promise((resolve,reject)=>{onAuthStateChanged(auth,u=>{if(u)resolve(u);else signInAnonymously(auth).catch(reject)},reject)});
let timer; const status=document.createElement('small');status.setAttribute('role','status');document.querySelector('main').append(status);
async function send(){const n=team+1, payload={stage:step+1,answers:{...data},updatedAt:serverTimestamp()};try{const u=await ready;await set(ref(db,'submissions/'+n+'/'+u.uid),payload);status.textContent='Отговорите са синхронизирани.'}catch(e){status.textContent='Неуспешна синхронизация. Проверете връзката или настройките.'}}
const originalStart=start;start=function(i){originalStart(i);send()};const originalGo=go;go=function(n){originalGo(n);send()};const originalDownload=downloadReport;downloadReport=function(){originalDownload();send()};app.addEventListener('input',e=>{if(e.target.matches('[data-field]')){save();clearTimeout(timer);timer=setTimeout(send,500)}});app.addEventListener('change',e=>{if(e.target.matches('[data-field]')){save();send()}});
