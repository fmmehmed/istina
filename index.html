<!doctype html><html lang="bg"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Детективи на истината</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1728;color:#eaf2ff;font:18px system-ui}main{max-width:1050px;margin:auto;padding:32px}header{color:#75e3d2;letter-spacing:3px;font-size:13px}h1{font-size:clamp(32px,6vw,60px);margin:20px 0}h2{color:#75e3d2}section,article{background:#152940;border:1px solid #34516a;border-radius:16px;padding:24px;margin:18px 0} .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.grid article{margin:0}button,a.btn{display:inline-block;background:#75e3d2;color:#102437;border:0;border-radius:9px;padding:12px 18px;font:inherit;font-weight:bold;cursor:pointer;text-decoration:none;margin:5px 0}button.secondary{background:#29465e;color:white}textarea,input,select{width:100%;background:#0b1728;color:white;border:1px solid #58758d;border-radius:8px;padding:12px;font:inherit;margin:8px 0 18px}small{color:#b3c7da}blockquote{border-left:4px solid #f2bd70;padding:12px 20px;background:#20354c;margin:15px 0}progress{width:100%;accent-color:#75e3d2}a{color:#75e3d2}button:focus-visible,a:focus-visible{outline:3px solid orange} @media print{body{background:white;color:black}section,article{background:white;color:black}button{display:none}}</style><main><header>КМИТ × БЕЛ • 6. КЛАС • ЦЕНТЪР ЗА РАЗСЛЕДВАНЕ</header><div id="app"></div></main><script>
const cases=[
['Следите на времето','Предстои изложба за 150-годишнината на вестник „Знаме“.','Национална библиотека 150 години Знаме 2 декември 6 януари 2024',['Кога е публикувано съобщението?','За коя годишнина и година се отнася?','Какво трябва да проверим, преди да кажем „предстои“?'],'27 ноември; 2024; 150','недостатъчно данни','Архивна публикация не доказва актуално събитие.'],
['Факт или мнение','Най-удобният музей за ученици! Експозицията на Националния военноисторически музей е отворена всеки делничен ден от 8:30 до 17:00 часа.','Национален военноисторически музей работно време експозиция администрация',['Коя част е мнение?','Какво е работното време на експозицията и администрацията?','Напишете точно заглавие.'],'Експозиция; Администрация','опровергано','Сравнете двата различни графика.'],
['Подвеждащото заглавие','Страхотна новина! Всички ученици вече влизат безплатно в Природонаучния музей всеки ден!','Национален природонаучен музей БАН безплатен вход 1 юни',['За кого важи безплатният вход на 1 юни?','Има ли платени ученически билети?','Кои думи подвеждат? Пренапишете заглавието.'],'Безплатен вход; ученици','опровергано','Проверете ограниченията за дата и възраст.'],
['Двойна проверка','Христо Ботев е роден на 6 януари 1848 г. в Калофер.','Христо Ботев летопис роден музей Калофер',['Какви дата и място посочва музеят?','Какви дата и място посочва Националната библиотека?','Как се обяснява датата през 1847 г.? Два сайта непременно независими ли са?'],'роден; 1848; стар стил','потвърдено','Старият и новият календар обясняват различните дати.']];
const app=document.getElementById('app');let team=0,step=0,data={};const search=q=>'https://www.google.com/search?q='+encodeURIComponent(q);function home(){app.innerHTML='<h1>Детективи на истината</h1><p>Четири екипа. Четири случая. Една мисия: проверете, преди да споделите.</p><section><h2>Първа реакция</h2><blockquote>'+cases[2][1]+'</blockquote><p>Вярвате ли? Не вярвате ли? Или първо ще проверите? Обсъдете с учителите.</p></section><div class="grid">'+cases.map((c,i)=>`<article><small>ДОСИЕ 0${i+1}</small><h2>${c[0]}</h2><button onclick="start(${i})">Отвори досието →</button></article>`).join('')+'</div>'}function start(i){team=i;step=0;data={};render()}function save(){document.querySelectorAll('[data-field]').forEach(e=>data[e.dataset.field]=e.value)}function go(n){save();step=n;render()}function render(){let c=cases[team];app.innerHTML=`<button class="secondary" onclick="if(confirm('Към началото? Текущите отговори ще се загубят.'))home()">← Начало</button><h1>${c[0]}</h1><small>ДОСИЕ 0${team+1} • ЕТАП ${step+1} ОТ 4</small><progress max="4" value="${step+1}"></progress><section><small>Учебно твърдение, създадено за анализ</small><blockquote>${c[1]}</blockquote><div id="stage"></div></section>`;let s=document.getElementById('stage');if(step===0)s.innerHTML='<h2>01 / Разпределете ролите</h2><p>Анализатор • Търсещ • Проверяващ • Секретар • Говорител</p><p>Всеки споделя поне едно наблюдение. Какво точно трябва да проверите?</p>'+field('claim','Проверявано твърдение')+'<button onclick="go(1)">Към доказателствата →</button>';if(step===1)s.innerHTML=`<h2>02 / Намерете доказателства</h2><p>Отворете резултат от официалната институция. Използвайте Ctrl+F: ${c[4]}.</p><a class="btn" target="_blank" rel="noopener" href="${search(c[2])}">Търси източник ↗</a> ${team===3?`<a class="btn" target="_blank" rel="noopener" href="${search('Национална библиотека Османски документи Ботевата чета')}">Втори източник ↗</a>`:''}`+c[3].map((q,i)=>field('q'+i,q)).join('')+field('url','Адреси на използваните страници')+'<button class="secondary" onclick="go(0)">Назад</button> <button onclick="go(2)">Към заключението →</button>';if(step===2)s.innerHTML='<h2>03 / Вашето решение</h2><label>Какво установихте?<select data-field="verdict"><option value="">Изберете</option><option>потвърдено</option><option>опровергано</option><option>недостатъчно данни</option></select></label>'+field('e1','Доказателство 1')+field('e2','Доказателство 2')+field('summary','Общо заключение за представяне')+'<button class="secondary" onclick="go(1)">Назад</button> <button onclick="finish()">Провери решението</button><p id="feedback" role="status"></p>';if(step===3)s.innerHTML='<h2>04 / Досието е завършено</h2><p>Представете решението си за две минути. Посочете двете доказателства и източниците.</p>'+field('exit','Преди да споделя информация, ще…')+'<button onclick="downloadReport()">Запази отчет</button> <button class="secondary" onclick="go(2)">Прегледай заключението</button>';document.querySelectorAll('[data-field]').forEach(e=>e.value=data[e.dataset.field]||'')}
function field(k,label){return `<label>${label}<textarea rows="2" data-field="${k}"></textarea></label>`}function finish(){save();let f=document.getElementById('feedback');if(!data.verdict||!data.e1?.trim()||!data.e2?.trim()||!data.summary?.trim()){f.textContent='Попълнете решението, двете доказателства и заключението.';return}if(data.verdict!==cases[team][5]){f.textContent='Проверете отново. '+cases[team][6];return}go(3)}function downloadReport(){save();let c=cases[team];let content=['Досие: '+c[0],c[1],'Проверяваме: '+(data.claim||''),...c[3].map((q,i)=>q+' '+(data['q'+i]||'')),'Източници: '+(data.url||''),'Решение: '+data.verdict,'Доказателство 1: '+data.e1,'Доказателство 2: '+data.e2,'Заключение: '+data.summary,'Преди да споделя: '+(data.exit||'')].join('\n\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type:'text/plain;charset=utf-8'}));a.download='dosie-'+(team+1)+'.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}home();</script></html>
